name: Build and Release Flutter APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.x'
          cache: true

      - name: Disable Kotlin Incremental Build
        run: |
          echo "kotlin.incremental=false" >> vaniguard/app/android/gradle.properties
          echo "kotlin.incremental.useClasspathSnapshot=false" >> vaniguard/app/android/gradle.properties

      - name: Get Dependencies
        run: |
          cd vaniguard/app
          flutter pub get

      - name: Build Release APK
        run: |
          cd vaniguard/app
          flutter build apk --release

      - name: Build Debug APK
        run: |
          cd vaniguard/app
          flutter build apk --debug

      - name: Create Release & Upload APKs
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: VaniGuard Mobile Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name || 'v1.0.1' }}
          draft: false
          prerelease: false
          files: |
            vaniguard/app/build/app/outputs/flutter-apk/app-release.apk
            vaniguard/app/build/app/outputs/flutter-apk/app-debug.apk
          body: |
            ## VaniGuard Android Mobile Release
            
            Download pre-compiled `.apk` packages directly to install VaniGuard on any Android phone without ADB!
            
            ### Package Files:
            - **`app-release.apk`**: Production release build.
            - **`app-debug.apk`**: Debug testing build.
            
            ### Installation Instructions:
            1. Open this page on your Android phone.
            2. Tap `app-release.apk` to download.
            3. Tap the file to install (allow *Unknown Sources* if prompted).
            4. Launch **VaniGuard**!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
