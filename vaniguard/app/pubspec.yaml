name: vaniguard
description: "Voice-First Secure Banking Platform with Real-Time Coercion Detection and Fraud Intervention"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: '>=0.19.0 <0.21.0'
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  record: ^5.2.1
  flutter_sound: ^9.2.13
  shared_preferences: ^2.3.2

dependency_overrides:
  record_platform_interface: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
