name: vaniguard
description: "Voice-First Secure Banking Platform with Real-Time Coercion Detection and Fraud Intervention"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: '>=0.19.0 <0.21.0'
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  speech_to_text: 7.4.0
  flutter_tts: ^4.2.5
  record: ^5.2.0
  shared_preferences: ^2.3.2
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  nfc_manager: ^4.2.1

dependency_overrides:
  record_android: 1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/branding/vaniguard_logo.png"
  min_sdk_android: 24
  adaptive_icon_background: "#1E1E1E"
  adaptive_icon_foreground: "assets/branding/vaniguard_logo.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/vaniguard_logo.png
    - assets/branding/vaniguard_logo_transparent.png
